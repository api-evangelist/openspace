  /api/external/v1/sites/{siteId}/field-notes/{fieldNoteId}/image:
    get:
      operationId: downloadFieldNoteImage
      parameters:
      - in: path
        name: siteId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: fieldNoteId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - description: (Optional) The desired image size. small=360px, medium=720px, large=1440px bounding box
        in: query
        name: size
        required: false
        schema:
          $ref: '#/components/schemas/ExternalImageSize'
      responses:
        '200':
          content:
            application/vnd.openspace.signed-url+json: {}
            image/jpeg: {}
          description: OK
        '302':
          description: Redirect to a location for downloading
        '401':
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                required:
                - error
                - message
                - redemptionEndpoint
                - status
                type: object
                properties:
                  email:
                    type:
                    - string
                    - 'null'
                    description: Email of the one account the phone is bound to but its owner has not yet claimed; absent for a phone-only invitee or when several accounts hold the phone
                    example: worker@example.com
                  error:
                    type: string
                    description: Error code identifying the specific error type
                    example: email_capture_required
                  fullName:
                    type:
                    - string
                    - 'null'
                    description: Optional full name from invitation
                    example: James Bond
                  message:
                    type: string
                    description: Human-readable error message
                    example: Please complete registration by providing your email address
                  redemptionEndpoint:
                    type: string
                    description: Endpoint to complete email capture and finish registration
                    example: /api/external/v1/auth/redeem-phone-invitation
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 403
          description: 'Forbidden: Partial authentication - email capture required'
        '404':
          description: Not found
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
      security:
      - api-key: []
      summary: Get Field Note Image
      tags:
      - Field notes
    servers:
    - url: /
      description: OpenSpace API root
