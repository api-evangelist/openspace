              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
      security:
      - api-key: []
      summary: Get all captures by site
      tags:
      - Sites
    servers:
    - url: /
      description: OpenSpace API root
