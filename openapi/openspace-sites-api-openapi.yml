          format: date-time
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          minimum: 1
          type: integer
          default: 1000
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
