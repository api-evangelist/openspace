components:
  schemas:
    WebhookRuleAction:
      type: string
      description: Action to take when this rule matches (ALLOW or DENY)
      enum:
      - allow
      - deny
    ExternalWebhookRulesGetResponse:
      required:
      - rules
      type: object
      properties:
        rules:
          type: array
          description: List of webhook rules
          items:
            $ref: '#/components/schemas/ExternalWebhookRule'
      description: Response containing a list of webhook rules
    WebhookEventType:
      type: string
      description: Event type to subscribe to
      enum:
      - field_note:created
      - field_note:deleted
      - field_note:updated
      - field_note_comment:created
      - field_note_comment:updated
      - field_note_comment:deleted
      - field_note_attachment:created
      - field_note_attachment:deleted
      - capture:published
      - voice_capture:published
    ExternalWebhookRule:
      required:
      - action
      - createdAt
      - eventType
      - id
      - organizationId
      - scope
      - webhookId
      type: object
      properties:
        action:
          $ref: '#/components/schemas/WebhookRuleAction'
        createdAt:
          type: string
          description: When the rule was created
          format: date-time
        createdBy:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: Account ID of the user who created this rule
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        id:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The unique identifier for the rule
        organizationId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The organization this rule applies to
        rateLimit:
          type: integer
          description: Optional rate limit specific to this rule (events per hour)
          format: int32
        scope:
          $ref: '#/components/schemas/WebhookRuleScope'
        siteGroupId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: Site group ID (required when scope is SITE_GROUP)
        siteId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: Site ID (required when scope is SITE)
        updatedAt:
          type: string
          description: When the rule was last updated
          format: date-time
        webhookId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The webhook this rule belongs to
      description: Webhook subscription rule defining which events trigger deliveries
    ExternalWebhookRuleCreateRequest:
      required:
      - action
      - eventType
      - scope
      type: object
      properties:
        action:
          $ref: '#/components/schemas/WebhookRuleAction'
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        rateLimit:
          type: integer
          description: Optional rate limit specific to this rule (events per hour)
          format: int32
        scope:
          $ref: '#/components/schemas/WebhookRuleScope'
        siteGroupId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: Site group ID (required when scope is SITE_GROUP)
        siteId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: Site ID (required when scope is SITE)
      description: Request to create a webhook rule
    ExternalWebhookRuleUpdateRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/WebhookRuleAction'
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        rateLimit:
          type: integer
          description: Optional rate limit specific to this rule (events per hour)
          format: int32
      description: Request to update a webhook rule
    WebhookRuleScope:
      type: string
      description: Scope level at which this rule applies (ORGANIZATION, SITE_GROUP, or SITE)
      enum:
      - site
      - siteGroup
      - organization
  securitySchemes:
    api-key:
      in: header
      name: api-key
      type: apiKey
    jwt-auth:
      bearerFormat: jwt
      scheme: bearer
      type: http
