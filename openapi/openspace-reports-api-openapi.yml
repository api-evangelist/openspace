openapi: 3.2.0
info:
  title: Openspace Reports API
  version: v3.0
  description: 'Operations tagged Reports across 2 of this provider''s published API definitions: openspace-external-v1-api-original.json, openspace-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
  description: OpenSpace API root
- url: https://api.us.openspace.ai
  description: OpenSpace API (US region; served at /v3/api-docs/external-v1-api)
tags:
- description: Reporting APIs
  name: Reports
paths:
  /api/external/v1/reports/360-videos:
    get:
      operationId: getReporting360Videos
      parameters:
      - description: Video started after
        example: '2020-01-01T12:00:00Z'
        in: query
        name: videoStartedAfter
        required: false
        schema:
          type: string
          format: date-time
      - description: Organization ids to select
        in: query
        name: orgs
        required: false
        schema:
          type: array
          items:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          minimum: 1
          type: integer
          default: 10
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - videoStart
            - videoStart,ASC
            - videoStart,DESC
            - orgName
            - orgName,ASC
            - orgName,DESC
            - siteName
            - siteName,ASC
            - siteName,DESC
            - sheetName
            - sheetName,ASC
            - sheetName,DESC
            - sheetCreated
            - sheetCreated,ASC
            - sheetCreated,DESC
            - sheetDisplayOrder
            - sheetDisplayOrder,ASC
            - sheetDisplayOrder,DESC
            - orgCreated
            - orgCreated,ASC
            - orgCreated,DESC
            - orgUpdated
            - orgUpdated,ASC
            - orgUpdated,DESC
            - siteCreated
            - siteCreated,ASC
            - siteCreated,DESC
          default:
          - videoStart,DESC
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporting360VideoPageResponse'
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                required:
                - error
                - message
                - redemptionEndpoint
                - status
                type: object
                properties:
                  email:
                    type:
                    - string
                    - 'null'
                    description: Email of the one account the phone is bound to but its owner has not yet claimed; absent for a phone-only invitee or when several accounts hold the phone
                    example: worker@example.com
                  error:
                    type: string
                    description: Error code identifying the specific error type
                    example: email_capture_required
                  fullName:
                    type:
                    - string
                    - 'null'
                    description: Optional full name from invitation
                    example: James Bond
                  message:
                    type: string
                    description: Human-readable error message
                    example: Please complete registration by providing your email address
                  redemptionEndpoint:
                    type: string
                    description: Endpoint to complete email capture and finish registration
                    example: /api/external/v1/auth/redeem-phone-invitation
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 403
          description: 'Forbidden: Partial authentication - email capture required'
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
      security:
      - api-key: []
      summary: Get all accessible 360 videos
      tags:
      - Reports
    servers:
    - url: /
      description: OpenSpace API root
