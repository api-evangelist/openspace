openapi: 3.2.0
info:
  title: Openspace Custom Field Notes API
  version: v3.0
  description: 'Operations tagged Custom Field Notes across 2 of this provider''s published API definitions: openspace-external-v1-api-original.json, openspace-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
  description: OpenSpace API root
- url: https://api.us.openspace.ai
  description: OpenSpace API (US region; served at /v3/api-docs/external-v1-api)
tags:
- description: Custom field notes APIs. Beta — subject to change without notification.
  name: Custom Field Notes
paths:
  /api/external/v1/sites/{siteId}/custom-field-notes/search:
    post:
      description: Beta — subject to change without notification. Lists a site's custom field notes, paged and sorted, filtered by template, integration type, crew, creator, sheet, zone, dates, free text and field values; `includeIds` narrows to specific notes. Pages hold at most 100 notes, a larger `size` is capped. Each note carries its field values as `fields..value`; when a value is an id from a vendor vocabulary or a select option, the entry also has `labels`, each resolved code mapped to its display text.
      operationId: searchCustomFieldNotes
      parameters:
      - in: path
        name: siteId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: query
        name: include
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - templates
            - templateVersions
            - photos
            - attachments
            - creators
            - comments
            - sheets
            - zones
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          minimum: 1
          type: integer
          default: 100
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - createdAt
            - createdAt,ASC
            - createdAt,DESC
            - modifiedAt
            - modifiedAt,ASC
            - modifiedAt,DESC
            - title
            - title,ASC
            - title,DESC
            - closed
            - closed,ASC
            - closed,DESC
            - uid
            - uid,ASC
            - uid,DESC
            - sheetName
            - sheetName,ASC
            - sheetName,DESC
            - zoneName
            - zoneName,ASC
            - zoneName,DESC
          default:
          - createdAt,DESC
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCustomFieldNoteSearch'
      responses:
        '200':
          content:
            application/json:
              examples:
                One ACC note, every field shape:
                  description: One ACC note, every field shape
                  value:
                    content:
                    - id: aR7EcQq0Rz6m1yN4Vw2pXg
                      siteId: qlCBQbP1TRahX2XbbJxdsQ
                      templateId: JxbiFwxLS06cHz1aXo-aAQ
                      templateVersionId: l21b_3oeTD2OLxtMbY4PIg
                      integrationType: accIssue
                      uniqueKey: '9001'
                      title: Conduit clash L2
                      closed: false
                      sheetId: 9kQmZ2xLTq6gW1bN8cV3yA
                      sheetPosition:
                      - 0.42
                      - 0.61
                      - 0
                      creatorId: 77CIu3rKQ0WcXkq8dTnVfw
                      createdAt: '2026-08-27T21:20:11Z'
                      updatedAt: '2026-08-28T08:02:34Z'
                      fields:
                        title:
                          value: Conduit clash L2
                        description:
                          value: null
                        dueDate:
                          value: '2026-09-02'
                        status:
                          value: in_review
                          labels:
                            in_review: In Review
                        issueSubtypeId:
                          value: 011dfa06-8c1e-4e4a-9d3b-2f6c7a8b9c0d
                          labels:
                            011dfa06-8c1e-4e4a-9d3b-2f6c7a8b9c0d: Coordination · Clash
                        locationId:
                          value: loc-301
                          labels:
                            loc-301: Project > Level 3 > Room 301
                        rootCauseId:
                          value: null
                        assignedTo:
                          value: gone-1
                          labels: {}
                        assignedToType:
                          value: company
                          labels:
                            company: Company
                        watchers:
                          value:
                          - oxygen-1
                          - company-1
                          - gone-2
                          labels:
                            oxygen-1: Kai Weber
                            company-1: Northwind Electrical
                      labelsResolved: false
                    page:
                      page: 0
                      size: 100
                      itemCount: 1
                      pageCount: 1
              schema:
                $ref: '#/components/schemas/ExternalCustomFieldNotesSearchResponse'
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                required:
                - error
                - message
                - redemptionEndpoint
                - status
                type: object
                properties:
                  email:
                    type:
                    - string
                    - 'null'
                    description: Email of the one account the phone is bound to but its owner has not yet claimed; absent for a phone-only invitee or when several accounts hold the phone
                    example: worker@example.com
                  error:
                    type: string
                    description: Error code identifying the specific error type
                    example: email_capture_required
                  fullName:
                    type:
                    - string
                    - 'null'
                    description: Optional full name from invitation
                    example: James Bond
                  message:
                    type: string
                    description: Human-readable error message
                    example: Please complete registration by providing your email address
                  redemptionEndpoint:
                    type: string
                    description: Endpoint to complete email capture and finish registration
                    example: /api/external/v1/auth/redeem-phone-invitation
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 403
          description: 'Forbidden: Partial authentication - email capture required'
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
      security:
      - api-key: []
      summary: Search custom field notes for a site
      tags:
      - Custom Field Notes
    servers:
    - url: /
      description: OpenSpace API root
  /api/external/v1/sites/{siteId}/custom-field-notes/{customFieldNoteId}/attachments/{attachmentId}/download:
    get:
      description: 'Beta — subject to change without notification.

        Returns one of the note''s file attachments. Photo attachments are served by the photo endpoint.


        Answers with a 302 to a short-lived presigned URL, or with the URL as JSON when the request sends exactly

        `Accept: application/vnd.openspace.signed-url+json`.'
      operationId: downloadAttachment
      parameters:
      - in: path
        name: siteId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: customFieldNoteId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: attachmentId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      responses:
        '200':
          content:
            application/vnd.openspace.signed-url+json:
              schema:
                $ref: '#/components/schemas/ExternalSignedUrl'
          description: 'The presigned URL as JSON, returned when the request sends `Accept: application/vnd.openspace.signed-url+json`'
        '302':
          description: Redirect to the presigned URL of the attachment; the response unless JSON was asked for
        '401':
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                required:
                - error
                - message
                - redemptionEndpoint
                - status
                type: object
                properties:
                  email:
                    type:
                    - string
                    - 'null'
                    description: Email of the one account the phone is bound to but its owner has not yet claimed; absent for a phone-only invitee or when several accounts hold the phone
                    example: worker@example.com
                  error:
                    type: string
                    description: Error code identifying the specific error type
                    example: email_capture_required
                  fullName:
                    type:
                    - string
                    - 'null'
                    description: Optional full name from invitation
                    example: James Bond
                  message:
                    type: string
                    description: Human-readable error message
                    example: Please complete registration by providing your email address
                  redemptionEndpoint:
                    type: string
                    description: Endpoint to complete email capture and finish registration
                    example: /api/external/v1/auth/redeem-phone-invitation
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 403
          description: 'Forbidden: Partial authentication - email capture required'
        '404':
          description: The note is not on this site or is outside the caller's crews, or the attachment is not on the note or is a photo
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
      security:
      - api-key: []
      summary: Download a custom field note attachment
      tags:
      - Custom Field Notes
    servers:
    - url: /
      description: OpenSpace API root
  /api/external/v1/sites/{siteId}/custom-field-notes/{customFieldNoteId}/comments:
    get:
      description: 'Beta — subject to change without notification. Lists the note''s comments, newest first, each with its author: the OpenSpace account, or for comments synced from Autodesk or Procore the integration user, marked by `author.origin`. `lastSynced` is when the integration''s comments were last pulled.'
      operationId: getComments
      parameters:
      - in: path
        name: siteId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: customFieldNoteId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - description: Pull the integration's comments before reading. A no-op for notes without an Autodesk or Procore integration. One round trip to the integration per call.
        in: query
        name: refresh
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCustomFieldNoteCommentsResponse'
          description: OK
        '401':
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                required:
                - error
                - message
                - redemptionEndpoint
                - status
                type: object
                properties:
                  email:
                    type:
                    - string
                    - 'null'
                    description: Email of the one account the phone is bound to but its owner has not yet claimed; absent for a phone-only invitee or when several accounts hold the phone
                    example: worker@example.com
                  error:
                    type: string
                    description: Error code identifying the specific error type
                    example: email_capture_required
                  fullName:
                    type:
                    - string
                    - 'null'
                    description: Optional full name from invitation
                    example: James Bond
                  message:
                    type: string
                    description: Human-readable error message
                    example: Please complete registration by providing your email address
                  redemptionEndpoint:
                    type: string
                    description: Endpoint to complete email capture and finish registration
                    example: /api/external/v1/auth/redeem-phone-invitation
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 403
          description: 'Forbidden: Partial authentication - email capture required'
        '404':
          description: The note does not exist on this site or is outside the caller's crews
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
        '503':
          description: refresh=true was requested and the integration could not be reached
      security:
      - api-key: []
      summary: Get the comments of a custom field note
      tags:
      - Custom Field Notes
    servers:
    - url: /
      description: OpenSpace API root
  /api/external/v1/sites/{siteId}/custom-field-notes/{customFieldNoteId}/photos/{photoId}/image:
    get:
      description: 'Beta — subject to change without notification.

        Returns one of the note''s photos, photo attachments included.


        Answers with a 302 to a short-lived signed URL, or with the URL as JSON when the request sends exactly

        `Accept: application/vnd.openspace.signed-url+json`. On sites without a CDN the response body is the photo itself.

        `size` returns a smaller copy; without it, the original.'
      operationId: getPhotoImage
      parameters:
      - in: path
        name: siteId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: customFieldNoteId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: photoId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - description: Serve a smaller copy of the photo; omitted serves the original
        in: query
        name: size
        required: false
        schema:
          $ref: '#/components/schemas/ExternalImageSize'
      responses:
        '200':
          content:
            application/vnd.openspace.signed-url+json:
              example:
                url: https://cdn.us.openspace.ai/content/...?Policy=...&Signature=...&Key-Pair-Id=...
              schema:
                $ref: '#/components/schemas/ExternalSignedUrl'
            image/*: {}
          description: 'Either the signed URL as JSON, when the request sends `Accept: application/vnd.openspace.signed-url+json`, or the photo itself, on a site without a CDN. Otherwise a 302.'
        '302':
          description: Redirect to the signed URL of the photo; the response unless JSON was asked for or the site has no CDN
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                required:
                - error
                - message
                - redemptionEndpoint
                - status
                type: object
                properties:
                  email:
                    type:
                    - string
                    - 'null'
                    description: Email of the one account the phone is bound to but its owner has not yet claimed; absent for a phone-only invitee or when several accounts hold the phone
                    example: worker@example.com
                  error:
                    type: string
                    description: Error code identifying the specific error type
                    example: email_capture_required
                  fullName:
                    type:
                    - string
                    - 'null'
                    description: Optional full name from invitation
                    example: James Bond
                  message:
                    type: string
                    description: Human-readable error message
                    example: Please complete registration by providing your email address
                  redemptionEndpoint:
                    type: string
                    description: Endpoint to complete email capture and finish registration
                    example: /api/external/v1/auth/redeem-phone-invitation
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 403
          description: 'Forbidden: Partial authentication - email capture required'
        '404':
          description: The note is not on this site or is outside the caller's crews, or the photo is not on the note or was deleted
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
      security:
      - api-key: []
      summary: Get a custom field note photo
      tags:
      - Custom Field Notes
    servers:
    - url: /
      description: OpenSpace API root
components:
  schemas:
    ExternalCommentOrigin:
      type: string
      description: 'Where the comment was written: in OpenSpace, or in the integration the note is linked to'
      enum:
      - openspace
      - autodesk
      - procore
    ExternalSignedUrl:
      required:
      - url
      type: object
      properties:
        url:
          type: string
          format: uri
      description: A short-lived URL, returned in place of a redirect
    Vec3:
      maxItems: 3
      minItems: 3
      type: array
      description: 3-element vector as [x, y, z] array
      example:
      - 0.0
      - 0.0
      - 0.0
      items:
        type: number
    ExternalCustomFieldNoteFieldValue:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
            description: 'Present only for code values (vendor ids, select options): each code of the value that resolved, keyed by the code as a string, mapped to its display text. A missing code is unresolved; an empty map means nothing resolved.'
          description: 'Present only for code values (vendor ids, select options): each code of the value that resolved, keyed by the code as a string, mapped to its display text. A missing code is unresolved; an empty map means nothing resolved.'
        value:
          $ref: '#/components/schemas/JsonNode'
      description: One stored field of a note
      example:
        title:
          value: Conduit clash
        dueDate:
          value: null
        status:
          value: in_review
          labels:
            in_review: In Review
        assignedTo:
          value: gone-1
          labels: {}
        watchers:
          value:
          - oxygen-1
          - gone-2
          labels:
            oxygen-1: Tony Martinez
    ExternalCustomFieldNoteSearch:
      type: object
      properties:
        closed:
          type: boolean
          description: 'Omitted: open and closed notes. true: closed only. false: open only.'
        collabGroupIds:
          uniqueItems: true
          type: array
          description: 'Filter by crew. Worklist callers: intersected with the caller''s own crews, empty means all of them. API keys: a plain filter, and an empty list matches nothing.'
          items:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
        createdAfter:
          type: string
          format: date-time
        createdBefore:
          type: string
          format: date-time
        creatorIds:
          uniqueItems: true
          type: array
          description: Notes created by these accounts
          items:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
        includeIds:
          uniqueItems: true
          type: array
          description: Only these notes, e.g. a batch fetch after a webhook or a single note for a detail view
          items:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
        integrationType:
          $ref: '#/components/schemas/ExternalCustomFieldNoteIntegrationType'
        query:
          type: string
          description: Free text over title, sheet name, creator email and display key
        sheetIds:
          uniqueItems: true
          type: array
          description: Notes placed on these sheets
          items:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
        templateIds:
          uniqueItems: true
          type: array
          description: Notes whose template version belongs to one of these templates
          items:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
        valueFilterCombinator:
          $ref: '#/components/schemas/CustomFieldNoteValueFilterCombinator'
        valueFilters:
          type: array
          description: 'Filters on template properties marked x-filterable; requires templateIds or integrationType. A filter is {propertyKey, operator, value} or {propertyKey, or|and: [{operator, value}]}. Operators by property type: strings eq, neq, in, notIn, contains, notContains; enums eq, neq, in, notIn; numbers and dates eq, neq, gte, lte, between (two inclusive bounds); booleans eq, neq; arrays eq, neq, contains, notContains, containsAny, notContainsAny, containsAll, notContainsAll; vendor references also refContains, refNotContains on the referenced record''s name; every type isNull, isNotNull. A 400 lists the allowed operators when one does not fit.'
          items:
            $ref: '#/components/schemas/CustomFieldNoteValueFilter'
        zoneIds:
          uniqueItems: true
          type: array
          description: Notes whose position lies inside one of these zones
          items:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
      description: Search criteria. Every field is optional; an empty body returns every note the caller may see.
    SheetEstimate:
      required:
      - id
      - sizeEstimate
      type: object
      properties:
        id:
          type: string
        sizeEstimate:
          $ref: '#/components/schemas/Vec3'
        sizeEstimateMethod:
          type: string
      description: The sheet estimate information
    ExternalCustomFieldNoteIncludes:
      required:
      - attachments
      - commentCounts
      - creators
      - customFieldNoteTemplateVersions
      - customFieldNoteTemplates
      - photos
      - sheets
      - zones
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCustomFieldNoteAttachment'
        commentCounts:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCustomFieldNoteCommentCount'
        creators:
          type: array
          items:
            $ref: '#/components/schemas/ExternalAccount'
        customFieldNoteTemplateVersions:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCustomFieldNoteTemplateVersion'
        customFieldNoteTemplates:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCustomFieldNoteTemplate'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCustomFieldNotePhoto'
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSheet'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCustomFieldNoteZone'
    ExternalImageSize:
      type: string
      enum:
      - small
      - medium
      - large
    Language:
      type: string
      description: The language preference of the account holder
      example: en
      enum:
      - de
      - en
      - es
      - ja
      - zh
      - zh-TW
    ExternalCustomFieldNoteTemplateVersion:
      required:
      - id
      - schema
      - templateId
      type: object
      properties:
        id:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
        schema:
          $ref: '#/components/schemas/JsonNode'
        templateId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
    ExternalIntegrationCommentAuthor:
      required:
      - integrationUserId
      - origin
      type: object
      description: A comment synced in from Autodesk or Procore
      allOf:
      - $ref: '#/components/schemas/ExternalCustomFieldNoteCommentAuthor'
      - type: object
        properties:
          integrationUserId:
            type: string
            description: The integration's own user id, Autodesk alphanumeric or Procore numeric
          name:
            type: string
            description: Null when the user is missing from the cached integration directory or nameless there
    ExternalCustomFieldNoteAttachmentKind:
      type: string
      enum:
      - photo
      - file
    ExternalAccount:
      required:
      - email
      - id
      - language
      type: object
      properties:
        email:
          type: string
          description: The email
        id:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The unique ID for the account
        language:
