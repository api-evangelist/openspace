components:
  schemas:
    ExternalExecutiveViewBatch:
      required:
      - capturedAt
      - id
      - kind
      - weekNumber
      type: object
      properties:
        capturedAt:
          type: string
          description: When the capture batch was taken; an ISO-8601 UTC timestamp
          format: date-time
        id:
          type: string
          description: The capture batch id
        kind:
          type: string
          description: 'The batch source: ''actual'' for a realized capture, ''planned'' for a scheduled one. New kinds may appear over time; treat unrecognized values as opaque.'
        weekNumber:
          type: integer
          description: The 1-based week number of the capture batch, counted from the project start date
          format: int32
      description: An ExecutiveView capture batch for a site
    ExternalExecutiveViewTaskInfo:
      required:
      - id
      - name
      type: object
      properties:
        displayIndex:
          type:
          - integer
          - 'null'
          description: The task display index, if provided
          format: int32
        id:
          type: string
          description: The task id
        name:
          type: string
          description: The task name
      description: A task
    ExternalExecutiveViewTreeNode:
      required:
      - children
      - id
      - leafSpaces
      - level
      - name
      - progress
      - spaces
      - tags
      type: object
      properties:
        children:
          type: array
          description: Child nodes
          items:
            $ref: '#/components/schemas/ExternalExecutiveViewTreeNode'
        displayIndex:
          type:
          - integer
          - 'null'
          description: Display ordering index, if set
          format: int32
        id:
          type: string
          description: The node id
        leafSpaces:
          type: array
          description: Leaf space ids under this node
          items:
            type: string
        level:
          type: string
          description: The hierarchy level of this node
        name:
          type: string
          description: The node name
        progress:
          $ref: '#/components/schemas/ExternalExecutiveViewNodeProgress'
        spaces:
          type: array
          description: Space ids grouped under this node
          items:
            type: string
        tags:
          type: array
          description: Tags applied to the node
          items:
            type: string
      description: A node in the ExecutiveView progress hierarchy; nests to arbitrary depth via `children`
    ExternalExecutiveViewSubcontractorSchedules:
      type: object
      properties:
        endOn:
          type:
          - string
          - 'null'
          description: Planned end date, as provided by the downstream (format not enforced)
        startOn:
          type:
          - string
          - 'null'
          description: Planned start date, as provided by the downstream (format not enforced)
      description: Planned schedule for a subcontractor
    ExternalExecutiveViewNodeProgress:
      type: object
      properties:
        actual:
          type:
          - number
          - 'null'
          description: Actual progress as a percentage (0-100), if recorded
          format: double
        planned:
          type:
          - number
          - 'null'
          description: Planned progress as a percentage (0-100), if recorded
          format: double
        status:
          type:
          - string
          - 'null'
          description: Progress status, if recorded
      description: Actual vs planned progress for an ExecutiveView node
    ExternalExecutiveViewTasksSearchRequest:
      required:
      - spaceIds
      - subcontractorId
      type: object
      properties:
        spaceIds:
          minItems: 1
          type: array
          description: Space ids to report task progress for; each must be a UUID
          items:
            pattern: '[0-9a-fA-F]{4}(?:[0-9a-fA-F]{4}-){4}[0-9a-fA-F]{12}'
            type: string
        subcontractorId:
          minLength: 1
          pattern: '[0-9a-fA-F]{4}(?:[0-9a-fA-F]{4}-){4}[0-9a-fA-F]{12}'
          type: string
          description: Subcontractor id to filter tasks by; must be a UUID
      description: Request body for ExecutiveView task progress
    ExternalExecutiveViewProgressPoint:
      required:
      - capturedAt
      type: object
      properties:
        actual:
          type:
          - number
          - 'null'
          description: Actual progress as a percentage (0-100), if recorded
          format: double
        batchId:
          type:
          - string
          - 'null'
          description: The capture batch id, if recorded
        capturedAt:
          type: string
          description: When the capture batch was taken; an ISO-8601 UTC timestamp
          format: date-time
        planned:
          type:
          - number
          - 'null'
          description: Planned progress as a percentage (0-100), if recorded
          format: double
      description: Actual vs planned progress recorded for a single capture batch
    PageData:
      required:
      - itemCount
      - page
      - pageCount
      - size
      type: object
      properties:
        itemCount:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageCount:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    ExternalExecutiveViewChartProgressesSearchRequest:
      required:
      - spaceIds
      type: object
      properties:
        spaceIds:
          minItems: 1
          type: array
          description: Space ids to report chart progress for; each must be a UUID
          items:
            pattern: '[0-9a-fA-F]{4}(?:[0-9a-fA-F]{4}-){4}[0-9a-fA-F]{12}'
            type: string
      description: Request body for ExecutiveView chart progress
    ExternalExecutiveViewSubcontractorsSearchRequest:
      required:
      - spaceIds
      type: object
      properties:
        spaceIds:
          minItems: 1
          type: array
          description: Space ids to report subcontractor progress for; each must be a UUID
          items:
            pattern: '[0-9a-fA-F]{4}(?:[0-9a-fA-F]{4}-){4}[0-9a-fA-F]{12}'
            type: string
      description: Request body for ExecutiveView subcontractor progress
    ExternalProgressSubcontractor:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
          description: The subcontractor id
        name:
          type: string
          description: The subcontractor name
      description: A subcontractor
    ExternalExecutiveViewSubcontractor:
      required:
      - history
      - schedules
      - subcontractor
      type: object
      properties:
        history:
          type: array
          description: Actual vs planned progress history, oldest first
          items:
            $ref: '#/components/schemas/ExternalExecutiveViewProgressPoint'
        schedules:
          $ref: '#/components/schemas/ExternalExecutiveViewSubcontractorSchedules'
        subcontractor:
          $ref: '#/components/schemas/ExternalProgressSubcontractor'
      description: Subcontractor progress for an ExecutiveView
    ExternalExecutiveViewTaskSchedules:
      type: object
      properties:
        endOn:
          type:
          - string
          - 'null'
          description: Planned end date, as provided by the downstream (format not enforced)
        startOn:
          type:
          - string
          - 'null'
          description: Planned start date, as provided by the downstream (format not enforced)
      description: Planned schedule for a task
    ExternalExecutiveViewChartProgressesSearchResponse:
      required:
      - content
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalExecutiveViewProgressPoint'
      description: ExecutiveView chart progress time series for a site, oldest first
    ExternalExecutiveViewTreeGetResponse:
      required:
      - content
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalExecutiveViewTreeNode'
      description: ExecutiveView progress tree for a site at a capture batch
    ExternalExecutiveViewTasksSearchResponse:
      required:
      - content
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalExecutiveViewTask'
      description: ExecutiveView task progress for a site
    ExternalExecutiveViewBatchesGetResponse:
      required:
      - content
      - page
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalExecutiveViewBatch'
        page:
          $ref: '#/components/schemas/PageData'
      description: Paginated list of ExecutiveView capture batches for a site, newest first. Unlike `/progress-tracking/progress-dates`, which lists only realized capture batches, this merges actual and planned batches (see `kind`). The downstream serves the full timeline; `page` describes the requested slice over that result set. Only the requested slice is validated, so a malformed record fails just the pages containing it and `page.itemCount` counts every row, including ones a later page may fail to serve.
    ExternalExecutiveViewSubcontractorsSearchResponse:
      required:
      - content
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalExecutiveViewSubcontractor'
      description: ExecutiveView subcontractor progress for a site
    ExternalExecutiveViewTask:
      required:
      - history
      - schedules
      - task
      type: object
      properties:
        history:
          type: array
          description: Actual vs planned progress history, oldest first
          items:
            $ref: '#/components/schemas/ExternalExecutiveViewProgressPoint'
        schedules:
          $ref: '#/components/schemas/ExternalExecutiveViewTaskSchedules'
        task:
          $ref: '#/components/schemas/ExternalExecutiveViewTaskInfo'
      description: Task progress for an ExecutiveView
  securitySchemes:
    api-key:
      in: header
      name: api-key
      type: apiKey
    jwt-auth:
      bearerFormat: jwt
      scheme: bearer
      type: http
