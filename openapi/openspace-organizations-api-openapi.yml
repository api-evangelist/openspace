components:
  schemas:
    RegistrationType:
      type: string
      description: The sheet size registration
      enum:
      - none
      - autoFit
      - autoGps
      - full
    ExternalOrganizationsGetResponse:
      required:
      - content
      - page
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalOrganization'
        page:
          $ref: '#/components/schemas/PageData'
    ExternalSite:
      required:
      - active
      - name
      type: object
      properties:
        active:
          type: boolean
          description: The site status
        address:
          type: string
          description: The site street address
        area:
          type: number
          description: Square value of the unit of measure
          format: float
        areaUnitOfMeasure:
          type: string
          description: Square feet or meters unit
          enum:
          - feet
          - meters
        country:
          type: string
          description: The site country
        createdAt:
          type: string
          description: When the site was created
          format: date-time
        id:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The unique ID for the site
        name:
          type: string
          description: The site name.
        organizationId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The organization id.
        projectKey:
          type: string
          description: The site project key
        registrationType:
          $ref: '#/components/schemas/RegistrationType'
        timeZone:
          type: string
          description: The site time zone
      description: Site information
    ExternalOrganization:
      required:
      - createdAt
      - id
      - name
      type: object
      properties:
        createdAt:
          type: string
          description: When the organization was created.
          format: date-time
        id:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The unique identifier for the organization
        name:
          type: string
          description: The organization name.
        updatedAt:
          type: string
          description: When the organization was last updated.
          format: date-time
      description: Organization information
    ExternalSitesGetResponse:
      required:
      - content
      - page
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSite'
        page:
          $ref: '#/components/schemas/PageData'
    PageData:
      required:
      - itemCount
      - page
      - pageCount
      - size
      type: object
      properties:
        itemCount:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageCount:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
  securitySchemes:
    api-key:
      in: header
      name: api-key
      type: apiKey
    jwt-auth:
      bearerFormat: jwt
      scheme: bearer
      type: http
x-refined-from:
- openspace-external-v1-api-original.json
