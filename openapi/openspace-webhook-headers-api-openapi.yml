      description: Get all custom headers configured for a webhook
      operationId: listHeaders
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: webhookId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalWebhookHeadersGetResponse'
          description: Success
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
      security:
      - api-key: []
      summary: List webhook headers
      tags:
      - Webhook Headers
    post:
      description: Add a custom header to include in webhook requests
      operationId: createHeader
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: webhookId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      requestBody:
