components:
  schemas:
    ExternalWebhookHeaderUpdateRequest:
      required:
      - headerValue
      type: object
      properties:
        headerValue:
          maxLength: 4096
          minLength: 0
          type: string
          description: New header value
      description: Request to update a webhook header
    ExternalWebhookHeadersGetResponse:
      required:
      - headers
      type: object
      properties:
        headers:
          type: array
          description: List of webhook headers
          items:
            $ref: '#/components/schemas/ExternalWebhookHeader'
      description: Response containing a list of webhook headers
    ExternalWebhookHeaderCreateRequest:
      required:
      - headerKey
      - headerValue
      type: object
      properties:
        headerKey:
          maxLength: 255
          minLength: 0
          type: string
          description: Header name (e.g., 'Authorization', 'X-API-Key')
        headerValue:
          maxLength: 4096
          minLength: 0
          type: string
          description: Header value
        isSecret:
          type: boolean
          description: Whether the header value should be encrypted at rest (defaults to true)
      description: Request to add a custom header to a webhook
    ExternalWebhookHeader:
      required:
      - createdAt
      - headerKey
      - headerValue
      - id
      - isSecret
      - webhookId
      type: object
      properties:
        createdAt:
          type: string
          description: When the header was created
          format: date-time
        createdBy:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: Account ID of the user who created this header
        headerKey:
          type: string
          description: Header name
        headerValue:
          type: string
          description: Header value (masked if secret)
        id:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The unique identifier for the header
        isSecret:
          type: boolean
          description: Whether the header value is encrypted/sensitive
        updatedAt:
          type: string
          description: When the header was last updated
          format: date-time
        webhookId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The webhook this header belongs to
      description: Custom header to include in webhook requests
  securitySchemes:
    api-key:
      in: header
      name: api-key
      type: apiKey
    jwt-auth:
      bearerFormat: jwt
      scheme: bearer
      type: http
x-refined-from:
- openspace-external-v1-api-original.json
- openspace-openapi.yml
