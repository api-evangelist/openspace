openapi: 3.2.0
info:
  title: Openspace Webhook Headers API
  version: v3.0
  description: 'Operations tagged Webhook Headers across 2 of this provider''s published API definitions: openspace-external-v1-api-original.json, openspace-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
  description: OpenSpace API root
- url: https://api.us.openspace.ai
  description: OpenSpace API (US region; served at /v3/api-docs/external-v1-api)
tags:
- description: Webhook custom header management APIs
  name: Webhook Headers
