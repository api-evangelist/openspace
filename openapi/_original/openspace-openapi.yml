  /api/external/v1/organizations/{organizationId}/webhooks/{webhookId}/update-secret:
    post:
      description: 'Rotate the secret token used for HMAC signatures. With the default
        skipVerify=false, the endpoint is probed with the new secret before persistence:
        on success the new secret is saved and verificationState is set to verified;
        on failure the rotation is rejected with 422 and the old secret stays in place.
        Pass ?skipVerify=true to save the secret without probing — state is reset
        to notVerified. Use the skipVerify escape hatch when the endpoint is known
        to be unreachable but rotation must still complete (e.g. suspected secret
        leak).'
      operationId: updateWebhookSecret
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: webhookId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: query
        name: skipVerify
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalWebhookUpdateSecretRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
