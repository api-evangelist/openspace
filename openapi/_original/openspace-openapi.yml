info:
  description: '<details>

    <summary><strong>Rate limiting</strong> — per-account throttling on all <code>/api/external/**</code>
    endpoints.</summary>


    ### Policies


    Two policies apply concurrently:


    - **Sustained** — a per-account quota refilled continuously over a 1-hour window.
    The specific quota is assigned per account and may change; read the `RateLimit`
    response header for the current value.

    - **Spike** — 100 requests per 10 seconds. On exhaustion, there is a 60-second
    cooldown before the spike bucket recovers.


    ### Response headers


    Every response (success or failure) includes two headers.


    **`RateLimit-Policy`** — describes the active policies, following the IETF [draft-ietf-httpapi-ratelimit-headers](https://datatracker.ietf.org/doc/html/draft-ietf-httpapi-ratelimit-headers)
    quoted-string format.


    ```

    Format:    "<policy>";q=<quota>;w=<window-sec>, ...

    Example:   RateLimit-Policy: "sustained";q=10000;w=3600, "spike";q=100;w=10

    ```


    **`RateLimit`** — current status for whichever policy is closest to exhaustion.
    The `r` value is the available quota (it can rise as well as fall, depending on
    the policy), and `t` is the effective window in seconds within which no more than
    `r` tokens may be spent.


    ```

    Format:    "<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>

    Example:   RateLimit: "spike";r=87;t=3;os-cost=1

    ```


    The `os-cost` parameter is an OpenSpace-specific extension reporting the on-arrival
    cost of the current request: `1` on accepted requests, `0` on `429` responses
    (the bucket was not debited).


    ### Cost model


    A request consumes 1 token on arrival. Longer-running requests cost more; the
    extra cost is charged after the response completes:


    - **< 1 second** — 1 token

    - **1 second ≤ duration < 5 seconds** — 2 tokens

    - **≥ 5 seconds** — 5 tokens


    Extra cost for slow requests is debited from the bucket internally; the lower
    available quota is reflected in the `RateLimit` header on subsequent requests.


    ### Handling `429` responses


    A `429 Too Many Requests` response includes:


    - `Retry-After` — seconds to wait before retrying (rounded up; always ≥ 1 second).

    - An `application/problem+json` body ([RFC 7807 Problem Details](https://datatracker.ietf.org/doc/html/rfc7807))
    with `type`, `title`, `status`, and `detail`.


    Clients should honor `Retry-After` as a minimum wait, and use exponential backoff
    with jitter when throttling persists across retries.


    </details>'
