          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: query
        name: include
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - templates
            - templateVersions
            - photos
            - attachments
            - creators
            - comments
            - sheets
            - zones
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - description: The size of the page to be returned
