        first. Unlike `/progress-tracking/progress-dates`, which lists only realized
        capture batches, this merges actual and planned batches (see `kind`). The
        downstream serves the full timeline; `page` describes the requested slice
        over that result set. Only the requested slice is validated, so a malformed
        record fails just the pages containing it and `page.itemCount` counts every
        row, including ones a later page may fail to serve.
