        in, notIn, contains, notContains; enums eq, neq, in, notIn; numbers and dates
        eq, neq, gte, lte, between (two inclusive bounds); booleans eq, neq; arrays
        eq, neq, contains, notContains, containsAny, notContainsAny, containsAll,
        notContainsAll; vendor references also refContains, refNotContains on the
        referenced record''s name; every type isNull, isNotNull. A 400 lists the allowed
        operators when one does not fit.'
