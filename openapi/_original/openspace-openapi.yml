  /api/external/v1/sites/{siteId}/custom-field-notes/search:
    post:
      description: Beta — subject to change without notification. Lists a site's custom
        field notes, paged and sorted, filtered by template, integration type, crew,
        creator, sheet, zone, dates, free text and field values; `includeIds` narrows
        to specific notes. Pages hold at most 100 notes, a larger `size` is capped.
