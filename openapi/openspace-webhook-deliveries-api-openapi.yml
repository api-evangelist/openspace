openapi: 3.2.0
info:
  title: Openspace Webhook Deliveries API
  version: v3.0
  description: 'Operations tagged Webhook Deliveries across 2 of this provider''s published API definitions: openspace-external-v1-api-original.json, openspace-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
  description: OpenSpace API root
- url: https://api.us.openspace.ai
  description: OpenSpace API (US region; served at /v3/api-docs/external-v1-api)
tags:
- description: Webhook delivery history and redelivery APIs
  name: Webhook Deliveries
paths:
  /api/external/v1/organizations/{organizationId}/webhooks/{webhookId}/deliveries:
    get:
      description: Get delivery history for a webhook
      operationId: listDeliveries
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: webhookId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          minimum: 1
          type: integer
          default: 100
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalWebhookDeliveriesGetResponse'
          description: Success
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Webhook not found
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
      security:
      - api-key: []
      summary: List webhook deliveries
      tags:
      - Webhook Deliveries
    servers:
    - url: /
      description: OpenSpace API root
  /api/external/v1/organizations/{organizationId}/webhooks/{webhookId}/deliveries/{deliveryId}:
    get:
      description: Get detailed information about a specific delivery including all attempts
      operationId: getDeliveryDetail
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: webhookId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: deliveryId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalWebhookDeliveryDetail'
          description: Success
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Delivery not found
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
      security:
      - api-key: []
      summary: Get delivery details
      tags:
      - Webhook Deliveries
    servers:
    - url: /
      description: OpenSpace API root
  /api/external/v1/organizations/{organizationId}/webhooks/{webhookId}/deliveries/{deliveryId}/redeliver:
    post:
      description: Retry delivery of a failed webhook event
      operationId: redeliverEvent
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: webhookId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - in: path
        name: deliveryId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalWebhookDelivery'
          description: Redelivery initiated
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Delivery not found
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
      security:
      - api-key: []
      summary: Redeliver webhook event
      tags:
      - Webhook Deliveries
    servers:
    - url: /
      description: OpenSpace API root
components:
  schemas:
    FieldNoteAttachmentCreatedPayload:
      required:
      - attachmentId
      - eventType
      - fieldNoteId
      - siteId
      type: object
      allOf:
      - $ref: '#/components/schemas/WebhookEventPayload'
      - type: object
        properties:
          attachmentId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          fieldNoteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          siteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
    WebhookEventPayload:
      required:
      - eventType
      type: object
      properties:
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
      description: The event payload that was delivered
      discriminator:
        mapping:
          capture:published: '#/components/schemas/CapturePublishedPayload'
          field_note:created: '#/components/schemas/FieldNoteCreatedPayload'
          field_note:deleted: '#/components/schemas/FieldNoteDeletedPayload'
          field_note:updated: '#/components/schemas/FieldNoteUpdatedPayload'
          field_note_attachment:created: '#/components/schemas/FieldNoteAttachmentCreatedPayload'
          field_note_attachment:deleted: '#/components/schemas/FieldNoteAttachmentDeletedPayload'
          field_note_comment:created: '#/components/schemas/FieldNoteCommentCreatedPayload'
          field_note_comment:deleted: '#/components/schemas/FieldNoteCommentDeletedPayload'
          field_note_comment:updated: '#/components/schemas/FieldNoteCommentUpdatedPayload'
          voice_capture:published: '#/components/schemas/VoiceCapturePublishedPayload'
        propertyName: eventType
      oneOf:
      - $ref: '#/components/schemas/FieldNoteCreatedPayload'
      - $ref: '#/components/schemas/FieldNoteDeletedPayload'
      - $ref: '#/components/schemas/FieldNoteUpdatedPayload'
      - $ref: '#/components/schemas/FieldNoteCommentCreatedPayload'
      - $ref: '#/components/schemas/FieldNoteCommentUpdatedPayload'
      - $ref: '#/components/schemas/FieldNoteCommentDeletedPayload'
      - $ref: '#/components/schemas/FieldNoteAttachmentCreatedPayload'
      - $ref: '#/components/schemas/FieldNoteAttachmentDeletedPayload'
      - $ref: '#/components/schemas/CapturePublishedPayload'
      - $ref: '#/components/schemas/VoiceCapturePublishedPayload'
    FieldNoteAttachmentDeletedPayload:
      required:
      - attachmentId
      - eventType
      - fieldNoteId
      - siteId
      type: object
      allOf:
      - $ref: '#/components/schemas/WebhookEventPayload'
      - type: object
        properties:
          attachmentId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          fieldNoteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          siteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
    ExternalWebhookDeliveryDetail:
      required:
      - attempts
      - delivery
      type: object
      properties:
        attempts:
          type: array
          description: All delivery attempts
          items:
            $ref: '#/components/schemas/ExternalWebhookDeliveryAttempt'
        delivery:
          $ref: '#/components/schemas/ExternalWebhookDelivery'
      description: Webhook delivery detail including all attempts
    WebhookDeliveryError:
      type: string
      description: Type of error that occurred (if any)
      enum:
      - none
      - connectionError
      - responseError
      - timeout
      - securityError
      - internalError
      - circuitBreakerSkip
    FieldNoteCommentUpdatedPayload:
      required:
      - commentId
      - eventType
      - fieldNoteId
      - siteId
      type: object
      allOf:
      - $ref: '#/components/schemas/WebhookEventPayload'
      - type: object
        properties:
          commentId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          fieldNoteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          siteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
    FieldNoteCommentCreatedPayload:
      required:
      - commentId
      - eventType
      - fieldNoteId
      - siteId
      type: object
      allOf:
      - $ref: '#/components/schemas/WebhookEventPayload'
      - type: object
        properties:
          commentId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          fieldNoteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          siteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
    WebhookDeliveryStatus:
      type: string
      description: Current status of the delivery
      enum:
      - pending
      - delivering
      - delivered
      - failed
      - circuitBreakerOpen
    PageData:
      required:
      - itemCount
      - page
      - pageCount
      - size
      type: object
      properties:
        itemCount:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageCount:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    FieldNoteUpdatedPayload:
      required:
      - changedFields
      - eventType
      - fieldNoteId
      - siteId
      type: object
      allOf:
      - $ref: '#/components/schemas/WebhookEventPayload'
      - type: object
        properties:
          changedFields:
            type: array
            items:
              type: string
          fieldNoteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          siteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
    ExternalWebhookDeliveriesGetResponse:
      required:
      - content
      - page
      type: object
      properties:
        content:
          type: array
          description: List of webhook deliveries
          items:
            $ref: '#/components/schemas/ExternalWebhookDelivery'
        page:
          $ref: '#/components/schemas/PageData'
      description: Response containing a paginated list of webhook deliveries
    ExternalWebhookDeliveryAttempt:
      required:
      - attemptId
      - deliveryId
      - requested
      type: object
      properties:
        attemptId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The unique identifier for the attempt
        deliveryId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The delivery this attempt belongs to
        errorType:
          $ref: '#/components/schemas/WebhookDeliveryError'
        latencyMs:
          type: integer
          description: Request latency in milliseconds
          format: int32
        requested:
          type: string
          description: When the request was sent
          format: date-time
        responseBodyExcerpt:
          type: string
          description: Excerpt of the response body
        responseCode:
          type: integer
          description: HTTP response code received
          format: int32
      description: Webhook delivery attempt record
    FieldNoteCreatedPayload:
      required:
      - eventType
      - fieldNoteId
      - siteId
      type: object
      allOf:
      - $ref: '#/components/schemas/WebhookEventPayload'
      - type: object
        properties:
          fieldNoteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          siteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
    CapturePublishedPayload:
      required:
      - captureId
      - captureType
      - eventType
      - siteId
      type: object
      allOf:
      - $ref: '#/components/schemas/WebhookEventPayload'
      - type: object
        properties:
          captureId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          captureType:
            $ref: '#/components/schemas/CaptureType'
          siteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
    CaptureType:
      type: string
      enum:
      - manual
      - passive
      - lidar
      - voice
      - drone
    FieldNoteCommentDeletedPayload:
      required:
      - commentId
      - eventType
      - fieldNoteId
      - siteId
      type: object
      allOf:
      - $ref: '#/components/schemas/WebhookEventPayload'
      - type: object
        properties:
          commentId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          fieldNoteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          siteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
    WebhookEventType:
      type: string
      description: Event type to subscribe to
      enum:
      - field_note:created
      - field_note:deleted
      - field_note:updated
      - field_note_comment:created
      - field_note_comment:updated
      - field_note_comment:deleted
      - field_note_attachment:created
      - field_note_attachment:deleted
      - capture:published
      - voice_capture:published
    FieldNoteDeletedPayload:
      required:
      - eventType
      - fieldNoteId
      - siteId
      type: object
      allOf:
      - $ref: '#/components/schemas/WebhookEventPayload'
      - type: object
        properties:
          fieldNoteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          siteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
    VoiceCapturePublishedPayload:
      required:
      - captureSessionId
      - eventType
      - siteId
      - voiceCaptureId
      type: object
      allOf:
      - $ref: '#/components/schemas/WebhookEventPayload'
      - type: object
        properties:
          captureSessionId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          siteId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
          voiceCaptureId:
            pattern: '[0-9A-Za-z_-]{22}'
            type: string
    ExternalWebhookDelivery:
      required:
      - attemptCount
      - createdAt
      - deliveryId
      - eventId
      - status
      - webhookId
      type: object
      properties:
        attemptCount:
          type: integer
          description: Number of delivery attempts made
          format: int32
        createdAt:
          type: string
          description: When the delivery was created
          format: date-time
        deliveryId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The unique identifier for the delivery
        eventId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The event that was delivered
        lastErrorCode:
          type: string
          description: Last error code if delivery failed
        lastErrorMessage:
          type: string
          description: Last error message if delivery failed
        payload:
          $ref: '#/components/schemas/WebhookEventPayload'
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        updatedAt:
          type: string
          description: When the delivery was last updated
          format: date-time
        webhookId:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
          description: The webhook that received the delivery
      description: Webhook delivery record tracking the delivery of an event to a webhook
  securitySchemes:
    api-key:
      in: header
      name: api-key
      type: apiKey
    jwt-auth:
      bearerFormat: jwt
      scheme: bearer
      type: http
x-refined-from:
- openspace-external-v1-api-original.json
- openspace-openapi.yml
