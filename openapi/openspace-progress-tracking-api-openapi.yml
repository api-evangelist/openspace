openapi: 3.2.0
info:
  title: Openspace Progress Tracking API
  version: v3.0
  description: 'Operations tagged Progress Tracking across 2 of this provider''s published API definitions: openspace-external-v1-api-original.json, openspace-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
  description: OpenSpace API root
- url: https://api.us.openspace.ai
  description: OpenSpace API (US region; served at /v3/api-docs/external-v1-api)
tags:
- description: Construction phases proxied from the Progress Tracking API
  name: Progress Tracking
paths:
  /api/external/v1/sites/{siteId}/progress-tracking/floorplans:
    get:
      operationId: getFloorplans
      parameters:
      - in: path
        name: siteId
        required: true
        schema:
          pattern: '[0-9A-Za-z_-]{22}'
          type: string
      - description: The construction phase to list floorplans for
        in: query
        name: phaseName
        required: true
        schema:
          type: string
      - description: 0-based page index; a negative value is clamped to 0
        in: query
        name: page
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - description: Page size; must be between 1 and 200 — a value outside is rejected with 400
        in: query
        name: size
        required: false
        schema:
          maximum: 200
          minimum: 1
          type: integer
          default: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalFloorplansGetResponse'
          description: Success
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                required:
                - error
                - message
                - redemptionEndpoint
                - status
                type: object
                properties:
                  email:
                    type:
                    - string
                    - 'null'
                    description: Email of the one account the phone is bound to but its owner has not yet claimed; absent for a phone-only invitee or when several accounts hold the phone
                    example: worker@example.com
                  error:
                    type: string
                    description: Error code identifying the specific error type
                    example: email_capture_required
                  fullName:
                    type:
                    - string
                    - 'null'
                    description: Optional full name from invitation
                    example: James Bond
                  message:
                    type: string
                    description: Human-readable error message
                    example: Please complete registration by providing your email address
                  redemptionEndpoint:
                    type: string
                    description: Endpoint to complete email capture and finish registration
                    example: /api/external/v1/auth/redeem-phone-invitation
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 403
          description: 'Forbidden: Partial authentication - email capture required'
        '404':
          description: Not found
        '429':
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    format: int32
                    example: 429
                  title:
                    type: string
                  type:
                    type: string
                    format: uri
          description: Rate limit exceeded. Honor the `Retry-After` header before retrying.
          headers:
            RateLimit:
              description: 'Current status for whichever policy is closest to exhaustion. Format: `"<policy>";r=<available>;t=<window-sec>;os-cost=<tokens-consumed>`'
              schema:
                type: string
            RateLimit-Policy:
              description: 'Active rate-limit policies. Format: `"<policy>";q=<quota>;w=<window-sec>, ...`'
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before retrying. Always >= 1.
              schema:
                type: string
        '500':
          description: Internal server error
        '503':
          description: Progress-tracking service unavailable
      security:
      - api-key: []
      summary: List floorplans for a phase
      tags:
      - Progress Tracking
    servers:
    - url: /
      description: OpenSpace API root
