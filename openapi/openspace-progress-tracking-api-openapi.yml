components:
  schemas:
    ExternalProgressHistoryEntry:
      required:
      - batchId
      - batchWeek
      - capturedAt
      type: object
      properties:
        batchId:
          type: string
          description: The capture batch id
        batchWeek:
          type: integer
          description: The week number of the capture batch
          format: int32
        capturedAt:
          type: string
          description: When the capture batch was taken, as provided by the downstream (format not enforced)
        progress:
          type:
          - number
          - 'null'
          description: Progress as a percentage (0-100) for this batch, if recorded
          format: double
      description: Progress recorded for a single capture batch
    ExternalSpotlightsGetResponse:
      required:
      - content
      - page
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSpotlight'
        page:
          $ref: '#/components/schemas/PageData'
      description: Spotlights for a scene, ordered by the spotlight's sequence number
    ExternalTaskProgressGetResponse:
      required:
      - content
      - page
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalTaskProgress'
        page:
          $ref: '#/components/schemas/PageData'
      description: Paginated list of task progress for a space. The returned `page` metadata reflects what the downstream actually served; `page.size` may be smaller than requested if the downstream clamps the page size.
    ExternalComponentProgressGetResponse:
      required:
      - content
      - page
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalComponentProgress'
        page:
          $ref: '#/components/schemas/PageData'
      description: Paginated list of component progress for a space. The returned `page` metadata reflects what the downstream actually served; `page.size` may be smaller than requested if the downstream clamps the page size.
    ExternalSpotlight:
      required:
      - history
      - id
      - type
      type: object
      properties:
        comment:
          type:
          - string
          - 'null'
          description: Latest comment text, if set
        commentAuthor:
          type:
          - string
          - 'null'
          description: Author of the latest comment, if set
        createdInBatch:
          allOf:
          - $ref: '#/components/schemas/ExternalCaptureBatch'
        defaultPriority:
          type:
          - string
          - 'null'
          description: Default priority for the spotlight type, if set
        deleted:
          type:
          - boolean
          - 'null'
          description: Whether the spotlight is deleted, if known
        description:
          type:
          - string
          - 'null'
          description: Free-text description, if set
        history:
          type: array
          description: Comment/update history for the spotlight, oldest first
          items:
            $ref: '#/components/schemas/ExternalSpotlightHistoryEntry'
        id:
          type: string
          description: The spotlight id
        mapping:
          allOf:
          - $ref: '#/components/schemas/ExternalSpotlightMapping'
        p2Type:
          type:
          - string
          - 'null'
          description: Secondary type classification, if set
        position:
          allOf:
          - $ref: '#/components/schemas/ExternalSpotlightPosition'
        priority:
          type:
          - string
          - 'null'
          description: Priority, as provided by the downstream, if set
        published:
          type:
          - boolean
          - 'null'
          description: Whether the spotlight is published, if known
        resolvedInBatch:
          allOf:
          - $ref: '#/components/schemas/ExternalCaptureBatch'
        sequenceNumber:
          type:
          - integer
          - 'null'
          description: Ordering sequence number, if set
          format: int32
        status:
          type:
          - string
          - 'null'
          description: Status, as provided by the downstream, if set
        subcontractor:
          allOf:
          - $ref: '#/components/schemas/ExternalSpotlightSubcontractor'
        type:
          type: string
          description: The spotlight type, as provided by the downstream
        userCreated:
          type:
          - boolean
          - 'null'
          description: Whether the spotlight was created by a user (rather than detected), if known
      description: 'A spotlight: an observation pinned inside a scene'
    ExternalComponentProgress:
      required:
      - component
      - history
      type: object
      properties:
        component:
          $ref: '#/components/schemas/ExternalProgressComponent'
        history:
          type: array
          description: Per-batch progress history, as returned by progress tracking
          items:
            $ref: '#/components/schemas/ExternalProgressHistoryEntry'
      description: Progress history for a single component within a space
    ExternalSpace:
      required:
      - bimModels
      - displayIndex
      - id
      - name
      - tags
      type: object
      properties:
        bim:
          allOf:
          - $ref: '#/components/schemas/ExternalSpaceBim'
        bimModels:
          type: array
          description: BIM models associated with the space
          items:
            $ref: '#/components/schemas/ExternalSpaceBimModel'
        category:
          type:
          - string
          - 'null'
          description: The space category
        displayIndex:
          type: integer
          description: Display ordering index within the phase
          format: int32
        id:
          type: string
          description: The space id
        name:
          type: string
          description: The space name
        parentId:
          type:
          - string
          - 'null'
          description: The parent space id, if this space is nested
        parentName:
          type:
          - string
          - 'null'
          description: The parent space name, if this space is nested
        tags:
          type: array
          description: Tags applied to the space
          items:
            type: string
        type:
          type:
          - string
          - 'null'
          description: The space type
      description: A construction space (area of a project) within a phase
    ExternalSpacesGetResponse:
      required:
      - content
      - page
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalSpace'
        page:
          $ref: '#/components/schemas/PageData'
      description: Paginated list of spaces for a phase. The returned `page` metadata reflects what the downstream actually served; `page.size` may be smaller than requested if the downstream clamps the page size.
    ExternalShotsGetResponse:
      required:
      - content
      - page
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExternalShot'
        page:
          $ref: '#/components/schemas/PageData'
      description: Shots for a scene, ordered newest capture batch first
    ExternalShot:
      required:
      - batch
      - id
      type: object
      properties:
        batch:
          $ref: '#/components/schemas/ExternalCaptureBatch'
        id:
          type: string
          description: The shot id
        imageId:
          type:
          - string
          - 'null'
          description: Identifier of the shot image, provided by the downstream (format not enforced)
        name:
          type:
          - string
          - 'null'
          description: The shot name, if set
        yaw:
          type:
          - number
          - 'null'
          description: The shot's yaw (heading) in degrees, if recorded
          format: double
      description: 'A shot: a single camera capture within a scene'
    ExternalFloorplanSequence:
      required:
      - id
      - scanLevel
      - sequencePrefix
      type: object
      properties:
        id:
          type: string
          description: The sequence id
        scanLevel:
